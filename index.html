function cls(){let r=C[cl].filter(x=>x[0].toLowerCase().includes(q.toLowerCase())),all=r.length&&r.every(x=>sel.has(x[0]));S.innerHTML='<div class="controls"><select id="cs" aria-label="Class period" class="class-select">'+Object.keys(C).map(x=>'<option '+(x===cl?'selected':'')+'>'+x+'</option>').join('')+'</select><input id="sq" aria-label="Search class roster" class="search" placeholder="⌕  Search students..." value="'+escapeHTML(q)+'"><span class="count">'+C[cl].length+' Students</span><button id="all" class="select-all">'+(all?'Clear All':'Select All')+'</button></div><div class="grid">'+r.map(x=>'<button class="student '+(sel.has(x[0])?'selected ':'')+(flash.has(x[0])?'awarded':'')+'" aria-pressed="'+sel.has(x[0])+'" data-st="'+x[0]+'"><span class="check">✓</span><div class="name">'+x[0]+'</div><div class="balance">$'+x[1]+'</div></button>').join('')+'</div><div class="pillars">'+P.map(x=>'<button class="pillar '+x[1]+'" data-p="'+x[0]+'"><i>'+x[2]+'</i><strong>'+x[0]+'</strong><small>'+x[3]+'</small></button>').join('')+'</div><div class="notice '+(last?'show':'')+'"><b class="ok">✓</b><span>'+(last?'<b>Recognized for '+last.p+'.</b> +1 Character Cash awarded to '+fmt(last.n)+'.':'')+'</span><button id="undo" class="undo">Undo</button><small>Just now</small></div><div class="panels"><div class="panel"><h2>◷ &nbsp; Recent Activity</h2>'+acts(4)+'</div><div class="panel"><h2>▥ &nbsp; Session Totals</h2><div class="stats"><div class="stat"><b>'+ (A.reduce((n,x)=>n+x.n.split(', ').length,0))+'</b><span>Recognitions</span></div><div class="stat"><b>'+new Set(A.flatMap(x=>x.n.split(', '))).size+'</b><span>Students</span></div><div class="stat"><b>'+new Set(A.map(x=>x.p)).size+'</b><span>Different Traits</span></div></div><div class="quote">“Small actions make a big difference.”</div></div><div class="panel reminders"><h2>▣ &nbsp; Quick Reminders</h2><ul><li>Notice the behavior.</li><li>Name the character trait.</li><li>A quick click makes a big impact.</li><li>Help build a stronger community.</li></ul></div></div>';$('#cs').onchange=e=>{cl=e.target.value;q='';sel.clear();flash.clear();clearTimeout(awardTimer);render()};$('#sq').oninput=e=>{q=e.target.value;let pos=e.target.selectionStart;cls();$('#sq').focus();$('#sq').setSelectionRange(pos,pos)};$('#all').onclick=()=>{r.forEach(x=>all?sel.delete(x[0]):sel.add(x[0]));cls()};document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{let n=b.dataset.st;sel.has(n)?sel.delete(n):sel.add(n);cls()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>award(b.dataset.p));$('#undo').onclick=undo}
function award(p){if(!sel.size||!P.some(x=>x[0]===p))return;let n=[...sel];n.forEach(x=>C[cl].find(y=>y[0]===x)[1]++);last={cl,n,p,A:[...A],H:JSON.parse(JSON.stringify(H))};A.unshift({p,n:n.join(', '),t:'Just now'});n.forEach(x=>(H[x]??=[]).unshift({p,t:'Just now'}));flash=set.animation?new Set(n):new Set();sel.clear();cls();clearTimeout(awardTimer);awardTimer=setTimeout(()=>{flash.clear();document.querySelectorAll('.awarded').forEach(b=>b.classList.remove('awarded'))},720)}function undo(){if(!last)return;clearTimeout(awardTimer);last.n.forEach(x=>C[last.cl].find(y=>y[0]===x)[1]--);A=last.A;H=last.H;last=null;flash.clear();cls()}
function rewards(){S.innerHTML='<div class="head"><div><h2>Rewards</h2><p>Simple privileges and experiences — no purchases, food, drinks, or inventory.</p></div></div><div class="rewards">'+R.map((r,i)=>'<button class="reward '+(reward===i?'selected-reward':'')+'" data-r="'+i+'"><b style="font-size:31px">'+r[3]+'</b><h3>'+r[0]+'</h3><p>'+r[1]+'</p><span class="price">$'+r[2]+'</span></button>').join('')+'</div><div class="redeem"><b>Demonstrate a redemption</b><select id="rs" aria-label="Student redeeming reward">'+people().map(x=>'<option '+(x.n===rewardStudent?'selected ':'')+'value="'+x.n+'">'+x.n+' — $'+x.b+'</option>').join('')+'</select><span>'+(reward===null?'Choose a privilege above.':R[reward][0]+' — $'+R[reward][2])+'</span><button id="rd" class="primary" '+(reward===null?'disabled':'')+'>Confirm redemption</button></div><div class="note"><b>Zero-cost recognition model.</b> Classroom privileges and experiences; no inventory or purchasing required.</div>';$('#rs').onchange=e=>{rewardStudent=e.target.value};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{reward=+b.dataset.r;rewards()});$('#rd').onclick=()=>{if(reward===null)return;let s=find($('#rs').value),r=R[reward];if(s.b<r[2])return alert('This fictional student needs more Character Cash for that privilege.');last=null;s.row[1]-=r[2];alert(r[0]+' redeemed for '+s.n+'. New balance: $'+s.row[1]+'.');reward=null;rewards()}}
function reports(){let t={};A.forEach(a=>t[a.p]=(t[a.p]||0)+a.n.split(', ').length);S.innerHTML='<div class="head"><div><h2>Reports</h2><p>A clear, positive snapshot of character recognition.</p></div></div><div class="reports"><div class="panel"><h2>Recognition by Character Pillar</h2>'+P.map(x=>{let z=t[x[0]]||0;return'<div class="barrow"><span>'+x[0]+'</span><div class="bar"><i class="'+x[1]+'" style="width:'+(100*z/Math.max(1,...Object.values(t)))+'%"></i></div><b>'+z+'</b></div>'}).join('')+'</div><div class="panel"><h2>Sample + session activity</h2><div class="summary"><div><b>'+ (A.reduce((n,x)=>n+x.n.split(', ').length,0))+'</b>recognitions</div><div><b>'+new Set(A.flatMap(x=>x.n.split(', '))).size+'</b>students reached</div><div><b>'+new Set(A.map(x=>x.p)).size+'</b>traits named</div><div><b>4</b>active classes</div></div><div class="note">Counts reflect the sample recognition history and awards in this session. Opening balances include earlier fictional activity.</div></div></div><div class="panel" style="margin-top:14px"><h2>Recent recognition</h2>'+acts(6)+'</div>'}
  
function students(){if(detail)return profile();let l=people().filter(x=>x.n.toLowerCase().includes(q.toLowerCase()));S.innerHTML='<div class="head"><div><h2>Students</h2><p>Positive character-recognition profiles only.</p></div><input id="ss" aria-label="Search all students" class="search" style="margin:0" placeholder="⌕  Search students..." value="'+escapeHTML(q)+'"></div><div class="list">'+l.map(x=>'<button data-d="'+x.n+'"><b>'+x.n+'</b><span>'+x.c.replace('Period ','P')+' · $'+x.b+' Character Cash</span></button>').join('')+'</div>';$('#ss').oninput=e=>{q=e.target.value;let pos=e.target.selectionStart;students();$('#ss').focus();$('#ss').setSelectionRange(pos,pos)};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{detail=b.dataset.d;q='';students()})}
function profile(){let s=find(detail),h=H[s.n]||[];S.innerHTML='<button id="back" class="secondary">← Student roster</button><div class="detail" style="margin-top:15px"><div class="card"><h2>'+s.n+'</h2><p>'+s.c+'</p><div class="big">$'+s.b+'</div><b>Character Cash balance</b><p style="margin-top:12px">'+h.length+' recorded recognition'+(h.length===1?'':'s')+'</p></div><div class="panel"><h2>Recognized for</h2><div class="mini">'+P.map(x=>'<div class="'+x[1]+'"><b>'+h.filter(y=>y.p===x[0]).length+'</b>'+x[2]+' '+x[0]+'</div>').join('')+'</div><h2 style="margin-top:18px">Recent recognition</h2>'+(h.length?h.map(x=>'<div class="history"><b>'+I[x.p]+' '+x.p+'</b><span style="float:right;color:var(--m)">'+x.t+'</span></div>').join(''):'<div class="history">No recognition has been recorded yet.</div>')+'</div></div>';$('#back').onclick=()=>{detail=null;students()}}
function settings(){S.innerHTML='<div class="head"><div><h2>Settings</h2><p>Small demonstration preferences for this local prototype.</p></div></div><div class="settings"><div class="card"><h3>Class on return</h3><p>Choose the class to show when you return to Class. This choice lasts for this session.</p><select id="dc" aria-label="Class on return" class="class-select" style="margin-top:13px">'+Object.keys(C).map(x=>'<option '+(x===cl?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="card"><button id="an" role="switch" aria-label="Recognition animation" aria-checked="'+set.animation+'" class="toggle '+(set.animation?'on':'')+'"></button><h3>Recognition animation</h3><p>Show the brief recipient-only balance animation after an award.</p></div><div class="card"><h3>Compact roster</h3><p>24 students per class. The compact layout is fixed for this demonstration.</p></div><div class="card"><h3>Display preferences</h3><p>Classroom-first layout with the Six Pillars always available during recognition.</p></div></div><div class="note"><b>DEMONSTRATION PROTOTYPE</b><br>Fictional student data only. Not connected to Derby Public Schools systems.</div>';$('#dc').onchange=e=>cl=e.target.value;$('#an').onclick=()=>{set.animation=!set.animation;settings()}}render();
</script></body></html>
