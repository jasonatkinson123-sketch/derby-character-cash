<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Derby Character Cash</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="mark">D</div>
      <nav class="nav" aria-label="Main navigation">
        <button class="active" data-view="class">⌂ <span>Class</span></button>
        <button data-view="rewards">♛ <span>Rewards</span></button>
        <button data-view="reports">▥ <span>Reports</span></button>
        <button data-view="students">♟ <span>Students</span></button>
        <button data-view="setup">＋ <span>Class Setup</span></button>
        <button data-view="settings">⚙ <span>Settings</span></button>
      </nav>
      <div class="foot"><div class="mark">D</div></div>
    </aside>
    <main>
      <header class="hero"><div class="brand"><h1>DERBY MIDDLE SCHOOL</h1><p>CHARACTER CASH</p></div></header>
      <div id="storageBanner" class="storage-banner">Classroom data is saved in this browser on this device.</div>
      <section id="screen" class="content" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="dialog" class="dialog"><div id="dialogBody"></div></dialog>
  <input id="avatarFile" type="file" accept="image/png,image/jpeg" hidden>
  <input id="restoreFile" type="file" accept="application/json,.json" hidden>
  <input id="csvFile" type="file" accept="text/csv,.csv" hidden>
  <script src="app.js"></script>
</body>
</html>
